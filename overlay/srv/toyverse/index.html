<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ToyMesh</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="ui/themes.css">
<link rel="stylesheet" href="ui/assist.css">
</head>
<body data-ui="toyclassic">
<div id="app">
  <header class="hdr">
    <b class="hdr-logo">ToyMesh <span id="uiver" class="hdr-ver"></span></b>
    <label class="hdr-sel"><span>Oberfläche</span>
      <select id="uisel" aria-label="Oberfläche wählen"></select>
    </label>
    <button id="biosbtn" class="hdr-btn" type="button" title="Einstellungen öffnen (Strg+Umschalt+B)">BIOS</button>
    <button id="wizbtn" class="hdr-btn" type="button">Assistent</button>
  </header>
  <main id="root" role="main"></main>
</div>

<div id="win" class="win" hidden role="dialog" aria-modal="true" aria-label="App-Fenster">
  <div class="win-bar"><span id="win-t"></span><button id="win-x" type="button" aria-label="Schließen">✕</button></div>
  <iframe id="win-f" title="App"></iframe>
</div>

<div id="wiz" class="wiz" hidden role="dialog" aria-modal="true" aria-label="Einrichtungs-Assistent">
  <div class="wiz-card">
    <div class="win-bar"><span>Einrichtung</span><button id="wiz-x" type="button" aria-label="Schließen">✕</button></div>
    <div id="wiz-b"></div>
  </div>
</div>

<script src="ui/toypost.js"></script>
<script src="ui/prefs.js"></script>
<script src="ui/openers.js"></script>
<script src="ui/assist.js"></script>
<script src="ui/shell.js"></script>
</body>
</html>
