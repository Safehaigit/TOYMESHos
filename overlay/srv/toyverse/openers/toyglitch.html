<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ToyMesh · Flash</title>
<style>
  :root { --t: #3ff5e0; --p: #9b5cff; --w: #ffffff; }
  html, body { margin: 0; height: 100%; background: #04040a; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Impact, "Arial Black", sans-serif; }
  .flash { position: absolute; inset: 0; background: var(--w); opacity: 0; animation: flash .5s ease-out forwards; pointer-events: none; }
  .title { position: relative; font-size: clamp(50px, 16vw, 140px); font-weight: 900; letter-spacing: .02em; color: var(--w);
    opacity: 0; animation: in .2s steps(2) .45s forwards; }
  .title::before, .title::after { content: "ToyMesh"; position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .title::before { color: var(--t); clip-path: inset(0 0 60% 0); transform: translate(-6px, 0); animation: slice1 2.4s steps(1) infinite; mix-blend-mode: screen; }
  .title::after { color: var(--p); clip-path: inset(60% 0 0 0); transform: translate(6px, 0); animation: slice2 2.4s steps(1) infinite; mix-blend-mode: screen; }
  .scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.25) 0 2px, transparent 2px 4px); }
  .sub { position: absolute; bottom: 18%; left: 0; right: 0; text-align: center; color: var(--t); font: 600 clamp(12px, 3.2vw, 16px)/1.2 system-ui, sans-serif;
    letter-spacing: .34em; text-transform: uppercase; opacity: 0; animation: in 1s ease 1.8s forwards; text-shadow: 0 0 8px var(--t); }
  .skip { position: fixed; right: 12px; bottom: 10px; color: #8a8fa3; font: 13px system-ui, sans-serif; background: none; border: 0; }
  @keyframes flash { 0% { opacity: .95 } 100% { opacity: 0 } }
  @keyframes in { to { opacity: 1 } }
  @keyframes slice1 { 0% { transform: translate(-6px,0) } 20% { transform: translate(-14px,2px) } 40% { transform: translate(-3px,-3px) } 60% { transform: translate(-10px,0) } 80% { transform: translate(-6px,0) } 100% { transform: translate(-6px,0) } }
  @keyframes slice2 { 0% { transform: translate(6px,0) } 25% { transform: translate(12px,-2px) } 50% { transform: translate(4px,3px) } 75% { transform: translate(9px,0) } 100% { transform: translate(6px,0) } }
  @media (prefers-reduced-motion: reduce) { *, *::after { animation-duration: .01s !important; animation-delay: 0s !important; } }
</style>
</head>
<body>
<div class="stage">
  <div class="title">ToyMesh</div>
  <div class="scan"></div>
  <div class="flash"></div>
  <div class="sub">System startet · Verbindung sicher</div>
</div>
<button class="skip" id="skip" type="button">Überspringen</button>
<script>
  function done() { try { parent.postMessage("opener-done", "*"); } catch (e) {} }
  document.getElementById("skip").addEventListener("click", done);
  document.body.addEventListener("click", done);
  setTimeout(done, 5000);
</script>
</body>
</html>
