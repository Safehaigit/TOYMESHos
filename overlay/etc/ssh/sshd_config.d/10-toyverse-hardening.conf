# ToyVerse Tab — sshd hardening drop-in.
# Only effective if you actually run sshd. If you don't need remote shell,
# disable it entirely:  rc-update del sshd ; rc-service sshd stop
#
# Key-only auth. Put your public key in /home/<user>/.ssh/authorized_keys
# BEFORE disabling passwords, or you will lock yourself out of SSH.

Protocol 2
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey

# Reduce attack surface
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
MaxAuthTries 3
MaxSessions 3
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2

# Modern crypto only
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# Optional: restrict who may log in
# AllowUsers youruser
