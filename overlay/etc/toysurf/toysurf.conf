# ToySurf — customizable browser config. Edit, then just relaunch `toysurf`.
# Shell-sourced, so use KEY=value with no spaces around '='.

# Engine: auto | full | lite
#   full = Firefox ESR  (best site compatibility + strongest hardening; heavier)
#   lite = WebKitGTK via surf/cog (tiny footprint for 1 GB RAM; lower compat)
#   auto = full if Firefox ESR is installed for this arch, else lite
TOYSURF_ENGINE=auto

# Start page / new-tab (served locally by toyverse-web)
TOYSURF_HOME="http://127.0.0.1:8080/toysearch/"

# Default search: where ToySearch forwards WEB queries.
#   local   = only your self-hosted ToySearch/SearXNG at TOYSEARCH_BACKEND
#   ddg     = DuckDuckGo HTML (no JS, privacy-friendly)
#   startpage, brave, searx (public instance URL in TOYSEARCH_BACKEND)
TOYSEARCH_MODE=ddg
TOYSEARCH_BACKEND="http://127.0.0.1:8888"   # used when TOYSEARCH_MODE=local/searx

# Hardening toggles (1=on)
TOYSURF_HTTPS_ONLY=1            # block plain HTTP
TOYSURF_BLOCK_ADS=1            # uBlock Origin (full) / content blocklist (lite)
TOYSURF_RESIST_FINGERPRINT=1  # Firefox RFP (full only)
TOYSURF_EPHEMERAL=0           # 1 = forget everything on close (private by default)
TOYSURF_DOH=1                 # DNS-over-HTTPS (full)
TOYSURF_SANDBOX=1             # run under bubblewrap/firejail if available
TOYSURF_TOR=0                 # 1 = route via local Tor (needs tor running)

# Window: kiosk|window  (kiosk = fullscreen, good for the tablet)
TOYSURF_MODE=window
