# ToyMesh website updates (toyweb-update). Empty = off.
# SOURCE: address with manifest.json, manifest.sigs/<signer>.sig and the archive
#         (https://, or http://127.0.0.1 for tests). Releases: scripts/sign-web-release.sh
SOURCE=""
# THRESHOLD: how many independent signers must sign at least (recommended: 2 of 3).
# Uses the same trusted keys as the UI updates (/etc/toymesh/keys).
THRESHOLD=2
